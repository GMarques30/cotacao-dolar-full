<div class="text-center py-4">
  <h1>Cotação do dolar</h1>
  <span class="display-2">R$ {{cotacaoAtual.toFixed(2)}}</span>
</div>

<main class="px-3">
  <form class="d-block text-center">
    <label class="mr-2" for="dataInicial">Data inicial
      <input id="dataInicial" type="date" name="dataInicial" class="form-control w-auto" [(ngModel)]="dataInicial" required>
    </label>

    <label class="mr-2" for="dataFinal">Data final
      <input id="dataFinal" type="date" name="dataFinal" class="form-control w-auto" [(ngModel)]="dataFinal" required>
    </label>

    <button type="submit"
            class="btn btn-primary"
            (click)="getCotacoes()">
      Pesquisar
    </button>

    <span role="alert" class="text-danger d-block my-2" *ngIf="errorMessage">
      {{errorMessage}}
    </span>

    <div class="form-check">
      <input type="checkbox" id="cotacaoMenoresAtual" class="form-check-input" [(ngModel)]="mostrarSomenteCotacoesMenoresAtual"
      name="mostrarSomenteCotacoesMenoresAtual">
      <label for="cotacaoMenoresAtual" class="form-check-label">Somente cotações menores que a atual</label>
    </div>
  </form>
</main>

<table class="table mt-3 container" *ngIf="cotacaoPorPeriodoLista.length > 0">
  <thead class="table-light">
    <tr>
      <th scope="col">DATA</th>
      <th scope="col">PREÇO</th>
      <th scope="col">DIFERENÇA</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let cotacao of cotacaoPorPeriodoLista">
      <td>{{ cotacao.dataTexto }}</td>
      <td>{{ cotacao.precoTexto }}</td>
      <td>{{ cotacao.diferenca }}</td>
    </tr>
  </tbody>
</table>
